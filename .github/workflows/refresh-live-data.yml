name: Refresh live Lake Pro data

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-live-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check refresh window
        id: window
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("America/Los_Angeles"))
          should_run = 7 <= now.hour <= 22
          print(f"should_run={'true' if should_run else 'false'}")
          print(f"local_time={now.isoformat()}")
          PY

      - name: Check out repo
        if: steps.window.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4

      - name: Set up Node
        if: steps.window.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        if: steps.window.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Refresh weather data
        id: pipeline
        if: steps.window.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch'
        timeout-minutes: 40
        run: python3 scripts/lakepro_pipeline.py

      - name: Capture lake cameras
        if: always() && (steps.window.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch') && steps.pipeline.outcome != 'skipped'
        timeout-minutes: 20
        run: node scripts/capture_lake_cameras.js

      # Commit whatever refreshed successfully even if some lakes failed —
      # the pipeline exits non-zero on partial failure (details land in
      # data/live/manifest.json), but discarding the other lakes' fresh data
      # would leave the whole site stale.
      - name: Commit refreshed artifacts
        if: always() && (steps.window.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch') && steps.pipeline.outcome != 'skipped'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cameras reports/camera-audit.json reports/camera-audit.md data/live
          if git diff --cached --quiet; then
            echo "No live data changes to commit."
          else
            git commit -m "Refresh live Lake Pro data"
            git pull --rebase origin main
            git push
          fi
